openapi: 3.0.3
info:
  title: Group Management API
  version: 1.0.0
  description: Group CRUD operations and member management via Keycloak Admin API

paths:
  /groups:
    get:
      summary: List all groups
      description: Retrieve all groups from Keycloak realm
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new group
      description: Create a new group in Keycloak realm
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid group data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Group already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}:
    get:
      summary: Get group by ID
      description: Retrieve specific group details including members
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Keycloak group UUID
          schema:
            type: string
      responses:
        '200':
          description: Group retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWithMembers'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete group
      description: Remove group from Keycloak realm
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Keycloak group UUID
          schema:
            type: string
      responses:
        '204':
          description: Group deleted successfully
        '400':
          description: Cannot delete group with members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members:
    post:
      summary: Add user to group
      description: Add a user to the specified group
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Keycloak group UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: Keycloak user UUID to add to group
              required:
                - userId
      responses:
        '200':
          description: User added to group successfully
        '400':
          description: User already in group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members/{userId}:
    delete:
      summary: Remove user from group
      description: Remove a user from the specified group
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Keycloak group UUID
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: Keycloak user UUID
          schema:
            type: string
      responses:
        '204':
          description: User removed from group successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group, user, or membership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: string
          description: Keycloak group UUID
        name:
          type: string
          description: Group name
        path:
          type: string
          description: Group hierarchy path
        memberCount:
          type: integer
          description: Number of members in group
      required:
        - id
        - name
        - path

    GroupWithMembers:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/GroupMember'
              description: Users belonging to this group

    GroupMember:
      type: object
      properties:
        id:
          type: string
          description: Keycloak user UUID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        enabled:
          type: boolean
          description: Whether user is enabled
      required:
        - id
        - username
        - email
        - enabled

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          enum: ['platform-admins', 'app-admins', 'users']
          description: Group name (must be one of predefined values)
      required:
        - name

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: string
          description: Additional error details
      required:
        - error
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT